name: Documents
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  documents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install document build tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            bash make zip unzip latexmk latexdiff \
            texlive-latex-extra texlive-publishers texlive-fonts-recommended \
            texlive-extra-utils poppler-utils ghostscript
      - name: Build and test documents
        run: make check-tools all bundle zip test
      - uses: actions/upload-artifact@v4
        with:
          name: manuscripts-and-rebuttals
          path: |
            original/*.pdf
            revised*/*.pdf
            reply*/*.pdf
            original/build/*.zip
            revised*/build/*.zip
          if-no-files-found: error
